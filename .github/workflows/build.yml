name: Build

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y g++ libglm-dev
      - run: bash tests/run_host_tests.sh
      - run: SANITIZE=1 bash tests/run_host_tests.sh
      - run: python3 -m py_compile tools/generate_location_localization.py
      - run: python3 tools/generate_location_localization.py --help

  switch-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v7
      - run: make
      - uses: actions/upload-artifact@v7
        with:
          name: botw-unexplored-nro
          path: botw-unexplored.nro
